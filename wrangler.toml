name = "hsk-ai-support"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
AI_BASE_URL = "https://api.openai.com/v1/chat/completions"
AI_MODEL = "gpt-4o-mini"

[triggers]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "hsk-ai-support"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
