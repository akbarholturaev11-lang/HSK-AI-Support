name = "hsk-ai-support"
main = "src/index.js"
compatibility_date = "2026-11-06"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[ai]
binding = "AI"

[vars]
AI_MODEL = "@cf/zai-org/glm-4.7-flash"
PUBLIC_WORKER_ORIGIN = "https://hsk-ai-support.hskaiiapp.workers.dev"

[triggers]
crons = ["*/5 * * * *", "0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "hsk-ai-support"
database_id = "4185e7cc-260a-4931-abdb-426bd6f21cfb"
