name = "hsk-ai-support"
main = "src/index.js"
compatibility_date = "2026-11-06"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[ai]
binding = "AI"

[vars]
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
PUBLIC_WORKER_ORIGIN = "https://hsk-ai-support.hskaiiapp.workers.dev"

[triggers]
crons = ["*/5 * * * *", "0 3 * * *"]

[[queues.producers]]
binding = "IMAGE_DELAY_QUEUE"
queue = "hsk-ai-support-image-delay"

[[queues.consumers]]
queue = "hsk-ai-support-image-delay"
max_batch_size = 5
max_batch_timeout = 1
max_retries = 5
retry_delay = 30

[[d1_databases]]
binding = "DB"
database_name = "hsk-ai-support"
database_id = "4185e7cc-260a-4931-abdb-426bd6f21cfb"

[[r2_buckets]]
binding = "KB"
bucket_name = "hsk-ai-support-kb"
