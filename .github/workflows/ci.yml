name: Support Bot checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Bundle Cloudflare Worker without deploying
        if: github.event_name == 'pull_request'
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir=./dist-v2
